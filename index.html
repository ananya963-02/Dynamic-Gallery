<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 600px;
            border: 1px solid black;
            display: flex;
        }
        .box{
            height: 100%;
            width: 25%;
            border: 1px solid black;
        }
        img{
            width: 100%;
        }
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align="center"> Dynamic Gallery </h1>
    <div class="con">
        <div class="box">
            <img src="image 1.PNG" alt="">
            <img src="image 2.PNG" alt="">
            <img src="image 3.PNG" alt="">
            <img src="image 4.PNG" alt="">
        </div>
        <div class="box">
            <img src="image 4.PNG" alt="">
            <img src="image 3.PNG" alt="">
            <img src="image 2.PNG" alt="">
            <img src="image 1.PNG" alt="">
        </div>
        <div class="box">
            <img src="image 3.PNG" alt="">
            <img src="image 1.PNG" alt="">
            <img src="image 4.PNG" alt="">
            <img src="image 2.PNG" alt="">
        </div>
        <div class="box">
            <img src="image 2.PNG" alt="">
            <img src="image 3.PNG" alt="">
            <img src="image 4.PNG" alt="">
            <img src="image 1.PNG" alt="">
        </div>
    </div>
    
</body>
</html>
